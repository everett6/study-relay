name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum

      - name: Build & test web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Vet & test Go server
        working-directory: server
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build binary
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o ../study-relay .
